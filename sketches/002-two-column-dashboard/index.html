<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Two-column Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;background:#172630;color:#edf6fb;font:14px Segoe UI,Arial,sans-serif}.top{height:50px;background:#354c5c;display:flex;align-items:center;padding:0 22px;gap:28px}.shell{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 50px)}aside{background:#1c2b34;padding:18px 14px}.nav{padding:10px 14px;border-radius:5px}.nav.active{background:#1686c0}.stage{padding:18px 26px}.head{display:grid;grid-template-columns:1fr auto;align-items:start}.head h1{margin:0;font-size:27px}.stats{display:flex;gap:7px}.stat{background:#294251;border:1px solid #496674;border-radius:7px;padding:9px 13px}.tabs{display:flex;gap:6px;margin:18px 0 12px}.tabs button,.btn{background:#1d3948;border:1px solid #456475;color:white;border-radius:6px;padding:9px 12px}.tabs .active,.primary{background:#169fd9}.command{display:grid;grid-template-columns:auto minmax(280px,1fr) 180px auto;gap:10px;background:#203440;border:1px solid #405967;border-radius:8px;padding:12px;margin-bottom:14px}.command input,.command select{background:#152933;color:white;border:1px solid #405c6b;border-radius:6px;padding:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(400px,1fr));gap:12px}.card{background:#2c4555;border:1px solid #496574;border-radius:9px;padding:15px;min-height:205px;display:flex;flex-direction:column}.title{display:flex;justify-content:space-between;gap:10px}.title h2{font-size:17px;margin:0}.badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.badge{font-size:10px;border:1px solid #608090;border-radius:99px;padding:3px 7px}.good{color:#4be493;border-color:#1fb56a}.warn{color:#ffc14d;border-color:#d98f00}.muted{color:#b9d1dd}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:10px 0}.meta b{display:block;color:#a8c7d5;font-size:10px}.actions{display:flex;gap:7px;margin-top:auto;border-top:1px solid #4b6472;padding-top:11px}.actions button{padding:7px 10px;border-radius:5px;background:#1c3644;border:1px solid #52717f;color:#fff}.actions .toggle{background:#159ed9}.actions .danger{margin-left:auto;color:#ff8392;border-color:#e4485e}.details{margin-top:8px;cursor:pointer}.extra{display:none;margin-top:8px;color:#b9d1dd}.open .extra{display:block}@media(max-width:1200px){.grid{grid-template-columns:1fr}}@media(max-width:850px){.shell{grid-template-columns:1fr}aside{display:none}.command{grid-template-columns:1fr}.stats{margin-top:10px}.head{display:block}}
</style></head><body><div class="top"><b>Stash</b><span>● Scenes</span><span>▣ Images</span><span>▦ Groups</span><span>● Markers</span><span>Performers</span><span>Studios</span><span>Tags</span></div><div class="shell"><aside><div class="nav">Tasks</div><div class="nav">Library</div><div class="nav">Interface</div><div class="nav">Security</div><div class="nav">Metadata Providers</div><div class="nav">Services</div><div class="nav">System</div><div class="nav active">Plugins</div><div class="nav">Logs</div><div class="nav">Tools</div><div class="nav">About</div></aside><main class="stage"><header class="head"><div><h1>Plugin Manager</h1><div class="muted">A wide-screen dashboard for your plugin library.</div></div><div class="stats"><span class="stat"><b>30</b> installed</span><span class="stat"><b>19</b> enabled</span><span class="stat"><b>0</b> updates</span></div></header><nav class="tabs"><button class="active">Installed 30</button><button>Browse 267</button><button>Sources 26</button><button>Configuration 30</button></nav><section class="command"><button class="btn primary">Check for updates</button><input id="search" placeholder="Search name, ID, description, or source"><select><option>All states</option></select><span style="align-self:center">30 results</span></section><div class="grid" id="grid"></div></main></div><script>
const rows=[['AI Tagger','ai_tagger','Tag videos and images with locally hosted AI models.','2.2-43feb59','Community (stable)',1,0],['ColorCodedTags','ColorCodedTags','Changes tag label colors based on naming convention.','0.3-e6c1a3f','coderdudeo',0,1],['CommunityScriptsUILibrary','CommunityScriptsUILibrary','Community Scripts UI helper library.','1.0.0-512fbb8','Community (stable)',1,0],['Content Banners','ContentBanners','Adds configurable preview banners to Stash detail pages.','2.2.0-7165206','rollainkraus',1,1],['Additional Files Deleter','deleter','Deletes matching sidecar files when a scene is removed.','0.1-43feb59','Community (stable)',0,0],['Stash AI','stashAI','Local metadata assistance for scenes and images.','1.8.2','Community (stable)',1,0]];
function draw(q=''){grid.innerHTML=rows.filter(x=>x.join(' ').toLowerCase().includes(q.toLowerCase())).map(x=>`<article class="card"><div class="title"><div><h2>${x[0]}</h2><code>${x[1]}</code></div><div class="badges"><span class="badge">Not checked</span><span class="badge ${x[5]?'good':''}">${x[5]?'Enabled':'Disabled'}</span><span class="badge ${x[6]?'warn':'good'}">${x[6]?'Community':'Official'}</span></div></div><p class="muted">${x[2]}</p><div class="meta"><span><b>VERSION</b>${x[3]}</span><span><b>SOURCE</b>${x[4]}</span><span><b>INSTALLED</b>12/19/2025</span></div><div class="details">▸ Capabilities<div class="extra">Hooks · UI assets · Settings</div></div><footer class="actions"><button>GitHub ↗</button><button class="toggle">${x[5]?'Disable':'Enable'}</button><button disabled>Update</button><button class="danger">Uninstall</button></footer></article>`).join('')}draw();search.oninput=()=>draw(search.value);document.addEventListener('click',e=>{if(e.target.classList.contains('details'))e.target.closest('.card').classList.toggle('open')});document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
</script></body></html>
