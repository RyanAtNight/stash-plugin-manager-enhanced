</style></head><body><div class="top"><b>Stash</b><span>● Scenes</span><span>▣ Images</span><span>▦ Groups</span><span>● Markers</span><span>Performers</span><span>Studios</span><span>Tags</span></div><div class="shell"><aside><div class="nav">Tasks</div><div class="nav">Library</div><div class="nav">Interface</div><div class="nav">Security</div><div class="nav">Metadata Providers</div><div class="nav">Services</div><div class="nav">System</div><div class="nav active">Plugins</div><div class="nav">Logs</div><div class="nav">Tools</div><div class="nav">About</div></aside><main class="stage"><div class="canvas"><header class="head"><div><h1>Plugin Manager</h1><div class="muted">Install, update, inspect, configure, and verify plugins.</div></div><div class="stats"><span class="pill"><b>30</b> installed</span><span class="pill"><b>19</b> enabled</span><span class="pill"><b>0</b> updates</span></div></header><nav class="tabs"><button class="active">Installed 30</button><button>Browse 267</button><button>Sources 26</button><button>Configuration 30</button></nav><section class="tools"><button class="btn primary">Check for updates</button><label>Search<input placeholder="Name, ID, description, or source"></label><label>Status<select><option>All states</option></select></label><span class="count">30 results</span></section><div id="cards"></div></div></main></div><script>
