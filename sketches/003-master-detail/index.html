<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Master Detail</title><style>
*{box-sizing:border-box}body{margin:0;background:#172630;color:#edf6fb;font:14px Segoe UI,Arial,sans-serif}.top{height:50px;background:#354c5c;display:flex;align-items:center;padding:0 22px;gap:28px}.shell{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 50px)}aside{background:#1c2b34;padding:18px 14px}.nav{padding:10px 14px;border-radius:5px}.nav.active{background:#1686c0}.stage{padding:18px 26px}.head{display:flex;justify-content:space-between}.head h1{margin:0;font-size:27px}.muted{color:#b4cedd}.stats{display:flex;gap:7px}.stat{background:#29414f;border:1px solid #486573;border-radius:7px;padding:9px 12px}.tabs{display:flex;gap:6px;margin:18px 0 12px}.tabs button,.btn{background:#1d3948;border:1px solid #456475;color:#fff;border-radius:6px;padding:9px 12px}.tabs .active,.primary{background:#169fd9}.toolbar{display:flex;gap:9px;background:#203440;border:1px solid #405967;border-radius:8px;padding:11px;margin-bottom:12px}.toolbar input{flex:1;background:#152933;color:white;border:1px solid #405c6b;border-radius:6px;padding:10px}.workspace{display:grid;grid-template-columns:minmax(380px,42%) minmax(500px,1fr);gap:14px;height:calc(100vh - 245px);min-height:560px}.list,.detail{background:#1d303b;border:1px solid #405967;border-radius:9px;overflow:auto}.listitem{display:grid;grid-template-columns:auto 1fr auto;gap:11px;padding:14px;border-bottom:1px solid #3d5562;cursor:pointer}.listitem:hover,.listitem.active{background:#2c4656}.listitem h3{margin:0 0 4px;font-size:16px}.listitem p{margin:4px 0;color:#b9d2de}.badge{font-size:10px;border:1px solid #5d7a89;border-radius:99px;padding:3px 7px;height:max-content}.good{color:#4be493;border-color:#1fb56a}.detail{padding:22px}.detailhead{display:flex;justify-content:space-between;gap:20px}.detail h2{font-size:24px;margin:0}.badgebar{display:flex;gap:6px;margin:16px 0}.facts{display:grid;grid-template-columns:repeat(3,1fr);background:#263f4d;border-radius:8px;padding:15px}.facts b{display:block;font-size:10px;color:#a8c8d6}.description{font-size:16px;line-height:1.6}.cap{border-top:1px solid #46616f;margin-top:22px;padding-top:16px}.actions{display:flex;gap:9px;margin-top:25px}.actions button{border:1px solid #52717f;background:#1d3745;color:#fff;border-radius:6px;padding:9px 14px}.actions .primary{background:#169fd9}.actions .danger{color:#ff8192;border-color:#e4485e;margin-left:auto}@media(max-width:1100px){.workspace{grid-template-columns:1fr;height:auto}.detail{min-height:450px}}@media(max-width:800px){.shell{grid-template-columns:1fr}aside{display:none}.stage{padding:14px}.stats{display:none}}
</style></head><body><div class="top"><b>Stash</b><span>● Scenes</span><span>▣ Images</span><span>▦ Groups</span><span>● Markers</span><span>Performers</span><span>Studios</span><span>Tags</span></div><div class="shell"><aside><div class="nav">Tasks</div><div class="nav">Library</div><div class="nav">Interface</div><div class="nav">Security</div><div class="nav">Metadata Providers</div><div class="nav">Services</div><div class="nav">System</div><div class="nav active">Plugins</div><div class="nav">Logs</div><div class="nav">Tools</div><div class="nav">About</div></aside><main class="stage"><header class="head"><div><h1>Plugin Manager</h1><div class="muted">Select a plugin to inspect and manage it without stretching every card.</div></div><div class="stats"><span class="stat"><b>30</b> installed</span><span class="stat"><b>19</b> enabled</span><span class="stat"><b>0</b> updates</span></div></header><nav class="tabs"><button class="active">Installed 30</button><button>Browse 267</button><button>Sources 26</button><button>Configuration 30</button></nav><section class="toolbar"><button class="btn primary">Check for updates</button><input id="search" placeholder="Search installed plugins"><button class="btn">All states</button></section><section class="workspace"><div class="list" id="list"></div><article class="detail" id="detail"></article></section></main></div><script>
const rows=[{n:'AI Tagger',id:'ai_tagger',d:'Tag videos and images with locally hosted AI models.',v:'2.2-43feb59',s:'Community (stable)',e:1,o:1},{n:'ColorCodedTags',id:'ColorCodedTags',d:'Changes tag label colors based on naming convention.',v:'0.3-e6c1a3f',s:'coderdudeo',e:0,o:0},{n:'CommunityScriptsUILibrary',id:'CommunityScriptsUILibrary',d:'Community Scripts UI helper library.',v:'1.0.0-512fbb8',s:'Community (stable)',e:1,o:1},{n:'Content Banners',id:'ContentBanners',d:'Adds configurable scene preview banners to detail pages.',v:'2.2.0-7165206',s:'rollainkraus',e:1,o:0},{n:'Additional Files Deleter',id:'deleter',d:'Deletes associated files when scene or image objects are removed.',v:'0.1-43feb59',s:'Community (stable)',e:0,o:1}];let selected=0;
function draw(q=''){list.innerHTML=rows.map((x,i)=>({x,i})).filter(a=>(a.x.n+a.x.id+a.x.d).toLowerCase().includes(q.toLowerCase())).map(a=>`<div class="listitem ${a.i===selected?'active':''}" data-i="${a.i}"><input type="checkbox"><div><h3>${a.x.n}</h3><code>${a.x.id}</code><p>${a.x.d}</p></div><span class="badge ${a.x.e?'good':''}">${a.x.e?'Enabled':'Disabled'}</span></div>`).join('');show(selected)}
function show(i){selected=i;let x=rows[i];detail.innerHTML=`<div class="detailhead"><div><h2>${x.n}</h2><code>${x.id}</code></div><button class="btn">GitHub ↗</button></div><div class="badgebar"><span class="badge">Updates not checked</span><span class="badge ${x.e?'good':''}">${x.e?'Enabled':'Disabled'}</span><span class="badge ${x.o?'good':''}">${x.o?'Official Stash source':'Community GitHub source'}</span></div><p class="description">${x.d}</p><div class="facts"><span><b>VERSION</b>${x.v}</span><span><b>SOURCE</b>${x.s}</span><span><b>INSTALLED</b>12/19/2025, 5:59 PM</span></div><section class="cap"><h3>Capabilities</h3><p class="muted">Scene.Update.Post hook · UI assets · configurable settings</p></section><div class="actions"><button class="primary">${x.e?'Disable':'Enable'}</button><button disabled>Update</button><button class="danger">Uninstall</button></div>`;document.querySelectorAll('.listitem').forEach(el=>el.classList.toggle('active',+el.dataset.i===selected))}draw();list.onclick=e=>{let r=e.target.closest('.listitem');if(r)show(+r.dataset.i)};search.oninput=()=>draw(search.value);document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
</script></body></html>
