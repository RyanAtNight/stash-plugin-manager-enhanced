name: Stash Plugin Manager Enhanced
description: A progressive enhancement of Stash's core Plugins settings page with focused Installed, Browse, Sources, and Configuration views.
version: 0.1.0
ui:
  javascript:
    - stash-plugin-manager-enhanced.js
  css:
    - stash-plugin-manager-enhanced.css
settings:
  lastUpdateCheck:
    displayName: Last update check
    description: Millisecond timestamp of the last successful Installed update check. Shared across browsers via Stash plugin configuration.
    type: NUMBER
